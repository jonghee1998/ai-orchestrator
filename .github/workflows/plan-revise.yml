# Auto mode (ORCH_AUTO): PM(Claude) applies the latest plan-audit findings to the plan Issue without a person.
# Dispatched by plan-review only. The edit is made with the owner PAT, so it opens the next audit round;
# on the last round it adds orch:go instead. Claude only reads the code and writes two files under .orch/.
name: plan-revise
run-name: "plan-revise #${{ inputs.issue }}"

on:
  workflow_dispatch:
    inputs:
      issue: { required: true, type: string }
      final: { required: false, type: string }

permissions: {}

concurrency:
  group: orch-usage   # shares the encrypted Codex login cache (Codex fallback)
  cancel-in-progress: false

jobs:
  revise:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: write    # prune old encrypted-login cache entries
      id-token: write   # claude-code-action
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Keep a trusted copy of the orchestrator scripts
        run: cp -r scripts/orch "$RUNNER_TEMP/orch"
      - name: Decide and build prompt
        id: prep
        run: node "$RUNNER_TEMP/orch/plan-revise.mjs" prepare
        env:
          BOT_PAT: ${{ secrets.BOT_PAT }}
          ISSUE: ${{ inputs.issue }}
          ORCH_AUTO: ${{ vars.ORCH_AUTO }}
      - name: Claude revises the plan (Opus)
        if: steps.prep.outputs.skip == 'false'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: "*"
          prompt: ${{ steps.prep.outputs.prompt }}
          claude_args: >-
            --max-turns 60
            --model opus
            --allowedTools "Read,Glob,Grep,Write,Task,Agent,Bash(ls:*),Bash(git log:*),Bash(mkdir:*)"
      - name: Restore encrypted Codex login
        if: steps.prep.outputs.skip == 'false' && vars.ORCH_CODEX != 'off' && vars.ORCH_CODEX_DEV != 'off'
        uses: actions/cache/restore@v4
        with:
          path: ~/.orch/codex-auth.enc
          key: codex-auth-latest
          restore-keys: codex-auth-
      - name: Unlock Codex login
        if: steps.prep.outputs.skip == 'false' && vars.ORCH_CODEX != 'off' && vars.ORCH_CODEX_DEV != 'off'
        continue-on-error: true
        env:
          CODEX_AUTH_KEY: ${{ secrets.CODEX_AUTH_KEY }}
        run: |
          umask 077
          [ -f ~/.orch/codex-auth.enc ] || exit 0
          mkdir -p ~/.codex
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:CODEX_AUTH_KEY -in ~/.orch/codex-auth.enc -out ~/.codex/auth.json 2>/dev/null || { rm -f ~/.codex/auth.json; exit 0; }
          sha256sum ~/.codex/auth.json | cut -c1-64 > "$RUNNER_TEMP/codex-before"
          npm i -g @openai/codex >/dev/null 2>&1
      # ---- Claude wrote nothing (usage limit / error): Codex does the same job with the same prompt.
      - name: Codex PM fallback
        if: steps.prep.outputs.skip == 'false' && vars.ORCH_CODEX != 'off' && vars.ORCH_CODEX_DEV != 'off'
        continue-on-error: true
        run: |
          if [ -f .orch/PLAN_REVISED.json ] || [ -f .orch/PLAN_REVISED.json ]; then echo "Claude 결과 있음"; exit 0; fi
          [ -f ~/.codex/auth.json ] || { echo "Codex 로그인 없음"; exit 0; }
          mkdir -p .orch
          codex exec --full-auto --skip-git-repo-check -o "$RUNNER_TEMP/codex-pm.md" \
            "$(cat "$RUNNER_TEMP/plan-revise-prompt.md")" > "$RUNNER_TEMP/codex-pm.log" 2>&1 || echo "Codex 실행 실패"
          ls -la .orch || true
      - name: Keep a refreshed Codex login
        id: relogin
        if: always() && steps.prep.outputs.skip == 'false'
        env:
          CODEX_AUTH_KEY: ${{ secrets.CODEX_AUTH_KEY }}
        run: |
          umask 077
          { [ -f ~/.codex/auth.json ] && [ -f "$RUNNER_TEMP/codex-before" ]; } || exit 0
          after=$(sha256sum ~/.codex/auth.json | cut -c1-64)
          if [ "$(cat "$RUNNER_TEMP/codex-before")" != "$after" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:CODEX_AUTH_KEY -in ~/.codex/auth.json -out ~/.orch/codex-auth.enc
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Remove Codex credentials from the runner
        if: always()
        run: rm -rf ~/.codex
      - name: Save refreshed encrypted login
        if: always() && steps.relogin.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.orch/codex-auth.enc
          key: codex-auth-${{ github.run_id }}
      - name: Prune old login cache entries
        if: always() && steps.relogin.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: codex-auth-${{ github.run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/caches?key=codex-auth-&per_page=100" --jq '.actions_caches[] | select(.key != env.KEEP) | .id' \
            | while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" --silent || true; done
      - name: Write back the plan (owner PAT) and start on the last round
        if: always() && steps.prep.outputs.skip == 'false'
        run: node "$RUNNER_TEMP/orch/plan-revise.mjs" publish
        env:
          BOT_PAT: ${{ secrets.BOT_PAT }}
          ISSUE: ${{ inputs.issue }}
          ORCH_AUTO: ${{ vars.ORCH_AUTO }}
