name: quality-gate
# Issue #174. pull_request_target runs the workflow + scripts from the BASE branch, so a PR cannot edit/disable the checker it is judged by.
# Do NOT add a checkout of the PR head or any step that executes PR-supplied code here.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]  # #176: PR body (receipts live there too) edits refresh the status
  workflow_dispatch:
    inputs:
      pr: { description: "PR number to (re)evaluate", required: true }
permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write
concurrency:
  group: quality-gate-${{ github.event.pull_request.number || inputs.pr }} # one writer per PR; every run re-reads live state
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        stage: [pre-pr, final]
    steps:
      - uses: actions/checkout@v4 # default ref for pull_request_target = BASE branch (trusted)
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/gate/check.mjs --repo "$GITHUB_REPOSITORY" --pr "$PR" --stage "${{ matrix.stage }}" --publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
